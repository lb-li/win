name: build-windows

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  core-tests:
    name: core tests (windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run core tests
        run: cargo test -p fsearch-core -p fsearch-win

  build-exe:
    name: build fsearch.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p fsearch-ui

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/fsearch.exe dist/fsearch.exe
          Get-Item dist/fsearch.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: fsearch-windows-x64
          path: dist/fsearch.exe
          if-no-files-found: error